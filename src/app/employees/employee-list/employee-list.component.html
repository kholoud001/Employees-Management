<div class="employee-list">
  <h1>Liste des employés</h1>
  <button (click)="onAdd()">Ajouter employé</button>
  <div class="employee-container" *ngFor="let employee of employees; let i = index">
    <app-employee-card
      [employee]="employee"
      [index]="i"
      (delete)="deleteEmployee($event)">
    </app-employee-card>
  </div>
</div>
