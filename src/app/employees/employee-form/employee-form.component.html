<div class="employee-form">
  <h1>{{ isEditMode ? 'Modifier' : 'Ajouter' }} un employé</h1>
  <form [formGroup]="employeeForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="name">Nom</label>
      <input
        id="name"
        type="text"
        formControlName="name"
        class="form-control"
        [class.is-invalid]="employeeForm.get('name')?.invalid && employeeForm.get('name')?.touched"
      />
      <div *ngIf="employeeForm.get('name')?.invalid && employeeForm.get('name')?.touched" class="invalid-feedback">
        Le nom est requis (au moins 3 caractères).
      </div>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        class="form-control"
        [class.is-invalid]="employeeForm.get('email')?.invalid && employeeForm.get('email')?.touched"
      />
      <div *ngIf="employeeForm.get('email')?.invalid && employeeForm.get('email')?.touched" class="invalid-feedback">
        Un email valide est requis.
      </div>
    </div>

    <div class="form-group">
      <label for="hireDate">Date d'embauche</label>
      <input
        id="hireDate"
        type="date"
        formControlName="hireDate"
        class="form-control"
        [class.is-invalid]="employeeForm.get('hireDate')?.invalid && employeeForm.get('hireDate')?.touched"
      />
      <div *ngIf="employeeForm.get('hireDate')?.invalid && employeeForm.get('hireDate')?.touched" class="invalid-feedback">
        La date d'embauche est requise.
      </div>
    </div>

    <button type="submit" [disabled]="employeeForm.invalid" class="btn btn-primary">
      {{ isEditMode ? 'Modifier' : 'Ajouter' }}
    </button>
    <button type="button" (click)="router.navigate(['/employees'])" class="btn btn-secondary">
      Annuler
    </button>
  </form>
</div>
